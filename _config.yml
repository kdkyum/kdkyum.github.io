title: Dong-Kyum Kim
description: Postdoc at the Max Planck Institute for Security and Privacy. AI interpretability and out-of-context reasoning.
url: https://kdkyum.github.io
baseurl: ""
lang: en
google_analytics: G-RKFWVE1P93 # added to pages in production builds only

# News: one Markdown file per item in _news/, shown on the homepage newest first.
collections:
  news:
    output: false
news_limit: # leave blank to show every item

# Papers: _bibliography/papers.bib, rendered with jekyll-scholar using _layouts/bib.html.
scholar:
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  last_name: [Kim]
  first_name: [Dong-Kyum]
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
